source = /home/$USER/.cache/wal/colors-hyprland

source = ~/.config/hypr/monitors.conf

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_DRM_NO_ATOMIC,1
env = NVD_BACKEND,direct
$terminal = kitty
$fileManager = nautilus
# $menu = wofi --show drun -n
$wofiWidth=80%
$wofiHeight=80%
$menu = wofi -n --width=$wofiWidth --height=$wofiHeight 
$mpvpaper = pkill mpvpaper; mpvpaper HDMI-A-3 $(~/.config/hypr/mpvpaper.sh)
#$mpvpaper = pkill mpvpaper; mpvpaper DP-6 $(wofi --prompt "YouTube URL" --height=$wofiHeight --width=$wofiWidth --dmenu)
exec-once = hypridle
exec-once = waybar
exec-once = swww-daemon
exec-once = swaync
exec-once = pypr
exec-once = swaync-client -df
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = hyprctl plugin load $HOME/.local/share/hyprpm/dynamic-cursors/dynamic-cursors.so
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = wf-recorder --muxer=v4l2 --codec=rawvideo --pixel-format=yuv420p --file=/dev/video1 -r 30
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

plugin:dynamic-cursors {
    mode = stretch
    threshold = 2
    shaperule = grab, stretch, stretch:limit: 2000
    rotate {
        length = 12
        offset = 30
    }
    stretch {
        limit = 1000
        # linear             - a linear function is used
        # quadratic          - a quadratic function is used
        # negative_quadratic - negative version of the quadratic one, feels more aggressive
        function = negative_quadratic
    }
    shake {
        enabled = false
    }
}
general { 
        gaps_in = 2
            gaps_out = 10
            border_size = 0
            col.active_border = $color9
            col.inactive_border = $color5
            resize_on_border = true
            allow_tearing = false
            layout = dwindle
}
cursor {
	inactive_timeout = 5
    no_hardware_cursors = true # Often required for HDR/10-bit to render correctly
}
decoration {
    rounding = 10
        active_opacity = 0.78
        inactive_opacity = 0.7
        fullscreen_opacity = 1
        blur {
            enabled = true
                size = 3
                passes = 2
                new_optimizations = true
                ignore_opacity = true
                xray = false
                popups = true
        }
    shadow {
        enabled = true
            range = 15
            render_power = 5
            color = rgba(0,0,0,.5)
    }
}
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}
dwindle {
    preserve_split = true
}
misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}
input {
    kb_layout = us
        follow_mouse = 1
        sensitivity = 0
        touchpad {
            natural_scroll = true
        }
}
device {
    name = epic-mouse-v1
    sensitivity = 0
}

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

$mainMod = SUPER
# bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, B, togglefloating
bind = $mainMod, C, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec,firefox
bind = $mainMod, G, exec, pypr toggle music
bind = $mainMod, I, exec, $mpvpaper
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exec, mpv $(wl-paste)
bind = $mainMod, O, exec, pavucontrol
bind = $mainMod, P, setprop, activewindow opaque toggle
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod, SPACE, exec, pypr toggle term
bind = $mainMod, T, exec, pypr toggle taskbar
bind = $mainMod, V, exec, cliphist list | wofi --dmenu --width=$wofiWidth --height=$wofiHeight  | cliphist decode | wl-copy
bind = $mainMod, down, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u

bind = $mainMod CTRL, left, workspace, -1
bind = $mainMod CTRL, right, workspace, +1

bind = ALT, 1, togglespecialworkspace, one
bind = ALT SHIFT, 1, movetoworkspace, special:one
bind = ALT, 2, togglespecialworkspace, two
bind = ALT SHIFT, 2, movetoworkspace, special:two
bind = ALT, 3, togglespecialworkspace, three
bind = ALT SHIFT, 3, movetoworkspace, special:three
bind = ALT, 4, togglespecialworkspace, four
bind = ALT SHIFT, 4, movetoworkspace, special:four

bind = , Print, exec, hyprshot -m window -o ~/Screenshots/

bind = ALT, B, exec, ~/.config/waybar/scripts/select.sh
bind = ALT, Print, exec, hyprshot -m active -m output -o ~/Screenshots/
bind = ALT, TAB, exec, wlogout -b 5
bind = ALT, a, exec, ~/.config/waybar/scripts/refresh.sh 
bind = ALT, down, movewindow, d 
bind = ALT, left, movewindow, l
bind = ALT, r, exec, ~/.config/swaync/refresh.sh
bind = ALT, right, movewindow, r
bind = ALT, t, exec, /home/shubham/Downloads/trilium-linux-x64/trilium
bind = ALT, up, movewindow, u
bind = ALT, w, exec, ~/.config/hypr/wallpaper.sh
bind = CTRL, Print, exec, hyprshot -m region -o ~/Screenshots/

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
#bind = CTRL, ESCAPE, exec, gksu #Dont worry about this

windowrule = match:class firefox, opacity 1.15
windowrule = rounding 0, match:class ^[fF]irefox
windowrule = float on, match:class ^(kitty-)(.*)
windowrule = match:class jetbrains-idea, opacity 1.2
